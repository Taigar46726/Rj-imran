<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai FOMO Coin</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        .header {
            margin-top: 25px;
            text-align: center;
        }
        .header h1 {
            color: #f39c12;
            font-size: 22px;
            letter-spacing: 1px;
        }
        .balance-card {
            font-size: 42px;
            font-weight: 800;
            color: #ffd700;
            margin-top: 5px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .tap-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        
        /* Inline SVG Coin Style */
        .coin-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.05s ease-in-out;
            filter: drop-shadow(0 0 20px rgba(243, 156, 18, 0.5));
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .coin-btn svg {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .coin-btn:active {
            transform: scale(0.92);
        }

        .energy-box {
            margin-top: 25px;
            font-size: 18px;
            color: #66fcf1;
            font-weight: 600;
        }

        .tab-content {
            display: none;
            width: 100%;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }
        .active-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: #1a1e24;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2c323b;
        }
        .card button {
            background: #f39c12;
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-bar {
            width: 100%;
            background: #14171c;
            display: flex;
            justify-content: space-around;
            padding: 14px 0;
            border-top: 1px solid #2c323b;
        }
        .nav-item {
            color: #8a94a6;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-item.active {
            color: #f39c12;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Ai FOMO Coin</h1>
        <div class="balance-card"><span id="balance">0</span></div>
    </div>

    <!-- Tap Tab -->
    <div id="tab-tap" class="tab-content active-tab">
        <div class="tap-area">
            <div class="coin-btn" onclick="tapCoin(event)">
                <!-- pure code-based Golden Coin SVG -->
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="gold" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
                            <stop offset="0%" stop-color="#ffe57f" />
                            <stop offset="50%" stop-color="#ffb300" />
                            <stop offset="100%" stop-color="#ff6f00" />
                        </radialGradient>
                        <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffecb3" />
                            <stop offset="50%" stop-color="#ffa000" />
                            <stop offset="100%" stop-color="#b78103" />
                        </linearGradient>
                    </defs>
                    <circle cx="100" cy="100" r="95" fill="url(#rim)" stroke="#d7ccc8" stroke-width="2"/>
                    <circle cx="100" cy="100" r="82" fill="url(#gold)" stroke="#ff8f00" stroke-width="4"/>
                    <circle cx="100" cy="100" r="72" fill="none" stroke="#ffe082" stroke-width="2" stroke-dasharray="6,4"/>
                    <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-size="34" font-weight="bold" fill="#000" opacity="0.15">FOMO</text>
                    <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" font-size="34" font-weight="bold" fill="#ffffff" style="text-shadow: 1px 1px 2px #000;">FOMO</text>
                </svg>
            </div>
            <div class="energy-box">⚡ Energy: <span id="energy">1000</span> / <span id="max-energy">1000</span></div>
        </div>
    </div>

    <!-- Boost Tab -->
    <div id="tab-boost" class="tab-content">
        <h3 style="margin-bottom: 15px; color: #f39c12;">Upgrades & Boosters</h3>
        
        <div class="card">
            <div>
                <h4>Multitap</h4>
                <p style="font-size: 12px; color: #aaa;">+1 per tap (Lvl <span id="tap-lvl">1</span>)</p>
                <p style="font-size: 13px; color: #ffd700;">Cost: <span id="tap-cost">100</span> Coins</p>
            </div>
            <button onclick="buyMultitap()">Upgrade</button>
        </div>

        <div class="card">
            <div>
                <h4>Energy Limit</h4>
                <p style="font-size: 12px; color: #aaa;">+500 Max Energy (Lvl <span id="energy-lvl">1</span>)</p>
                <p style="font-size: 13px; color: #ffd700;">Cost: <span id="energy-cost">200</span> Coins</p>
            </div>
            <button onclick="buyEnergyLimit()">Upgrade</button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('tap', this)">👆 Tap</div>
        <div class="nav-item" onclick="switchTab('boost', this)">⚡ Boost</div>
    </div>

    <script>
        let balance = localStorage.getItem('aifomo_bal') ? parseInt(localStorage.getItem('aifomo_bal')) : 0;
        let tapPower = localStorage.getItem('aifomo_power') ? parseInt(localStorage.getItem('aifomo_power')) : 1;
        let tapLvl = localStorage.getItem('aifomo_tap_lvl') ? parseInt(localStorage.getItem('aifomo_tap_lvl')) : 1;
        
        let maxEnergy = localStorage.getItem('aifomo_max_e') ? parseInt(localStorage.getItem('aifomo_max_e')) : 1000;
        let energyLvl = localStorage.getItem('aifomo_e_lvl') ? parseInt(localStorage.getItem('aifomo_e_lvl')) : 1;
        let energy = localStorage.getItem('aifomo_e') !== null ? parseInt(localStorage.getItem('aifomo_e')) : maxEnergy;
        
        let lastReset = localStorage.getItem('aifomo_reset') ? parseInt(localStorage.getItem('aifomo_reset')) : Date.now();

        if (Date.now() - lastReset > 24 * 60 * 60 * 1000) {
            energy = maxEnergy;
            localStorage.setItem('aifomo_e', energy);
            localStorage.setItem('aifomo_reset', Date.now());
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance.toLocaleString();
            document.getElementById('energy').innerText = energy;
            document.getElementById('max-energy').innerText = maxEnergy;
            
            document.getElementById('tap-lvl').innerText = tapLvl;
            document.getElementById('tap-cost').innerText = tapLvl * 100;

            document.getElementById('energy-lvl').innerText = energyLvl;
            document.getElementById('energy-cost').innerText = energyLvl * 200;
        }

        function tapCoin(e) {
            if (energy >= tapPower) {
                balance += tapPower;
                energy -= tapPower;
                localStorage.setItem('aifomo_bal', balance);
                localStorage.setItem('aifomo_e', energy);
                updateUI();
            } else {
                alert("Daily energy limit reached! Wait for reset.");
            }
        }

        function buyMultitap() {
            let cost = tapLvl * 100;
            if (balance >= cost) {
                balance -= cost;
                tapPower += 1;
                tapLvl += 1;
                localStorage.setItem('aifomo_bal', balance);
                localStorage.setItem('aifomo_power', tapPower);
                localStorage.setItem('aifomo_tap_lvl', tapLvl);
                updateUI();
            } else {
                alert("Not enough coins!");
            }
        }

        function buyEnergyLimit() {
            let cost = energyLvl * 200;
            if (balance >= cost) {
                balance -= cost;
                maxEnergy += 500;
                energy += 500;
                energyLvl += 1;
                localStorage.setItem('aifomo_bal', balance);
                localStorage.setItem('aifomo_max_e', maxEnergy);
                localStorage.setItem('aifomo_e', energy);
                localStorage.setItem('aifomo_e_lvl', energyLvl);
                updateUI();
            } else {
                alert("Not enough coins!");
            }
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById('tab-' + tab).classList.add('active-tab');
            el.classList.add('active');
        }

        updateUI();
    </script>
</body>
</html>
