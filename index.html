<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiFomo Coin Tap Game</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        h1 {
            color: #f39c12;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .score-board {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .coin-btn {
            width: 230px;
            height: 230px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.08s ease;
            filter: drop-shadow(0 0 15px rgba(243, 156, 18, 0.4));
        }
        .coin-btn img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .coin-btn:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <h1>Ai FOMO Coin</h1>
    <div class="score-board">Coins: <span id="score">0</span></div>

    <div class="coin-btn" onclick="tapCoin()">
        <img src="13558.png" onerror="this.src='coin.png'" alt="Ai Fomo Coin">
    </div>

    <script>
        let count = localStorage.getItem('aifomo_coins') ? parseInt(localStorage.getItem('aifomo_coins')) : 0;
        document.getElementById('score').innerText = count;

        function tapCoin() {
            count++;
            document.getElementById('score').innerText = count;
            localStorage.setItem('aifomo_coins', count);
        }
    </script>

</body>
</html>
